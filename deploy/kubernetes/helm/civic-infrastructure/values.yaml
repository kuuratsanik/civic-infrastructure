# Default values for civic-infrastructure
nameOverride: ""
fullnameOverride: "civic"

image:
  repository: civic-infrastructure/orchestrator
  tag: local
  pullPolicy: IfNotPresent

imagePullSecrets: []

orchestrator:
  replicaCount: 1
  lightMode: false
  heartbeatSeconds: 60
  ollamaHost: http://127.0.0.1:11434
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  env: {}

service:
  type: ClusterIP
  port: 8080

persistence:
  enabled: true
  size: 5Gi
  storageClassName: ""
  accessModes:
    - ReadWriteOnce

ollama:
  enabled: true
  image: ollama/ollama:latest
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 8Gi
  persistence:
    enabled: true
    size: 20Gi
    storageClassName: ""

n8n:
  enabled: false
  image: n8nio/n8n:1.64.3
  basicAuthUser: civic-admin
  # Set via --set n8n.basicAuthPassword=... or external secret
  basicAuthPassword: ""
  service:
    type: ClusterIP
    port: 5678

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
